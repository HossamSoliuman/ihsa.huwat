openapi: 3.0.3
info:
  title: Hawat Mobile API
  version: 1.2.0
  description: |
    Hawat mobile app API (com.os.hawat). All responses are JSON.

    - Authentication: `Authorization: Bearer <token>` (Laravel Sanctum). A token is issued per device on login.
    - Phone numbers use the `05XXXXXXXX` format; `+9665…`, `9665…` and Arabic digits are also accepted and normalized.
    - Validation errors: `422` shaped as `{ "message": "...", "errors": { "field": ["..."] } }`.
    - Unauthenticated: `401 { "message": "Unauthenticated." }`. Disabled account: `403`.
    - Throttling: login 6/min, OTP request 3/min per phone number.
    - Lookup lists: `GET /lookups` once after login.
    - The owner portal lives under `/owner/*` and requires the `owner` role; every record is scoped to its owner (`404` otherwise).
    - The captain portal lives under `/captain/*` and requires the `captain` role; only trips assigned to the captain are visible (`404` otherwise).
    - Notifications (`/notifications`) are per account for every role; the app registers its device with `POST /auth/fcm-token` to receive pushes.
    - Paginated lists return `{ data: [...], links: {...}, meta: {...} }` with `?page=` and `?per_page=` (max 100).
    - Changelog: docs/api/CHANGELOG.md.
servers:
- url: /api/v1
tags:
- name: auth
  description: الدخول والحساب واستعادة كلمة المرور
- name: lookups
  description: القوائم المرجعية
- name: owner
  description: بوابة المالك — الرئيسة والمخزون
- name: owner-fleet
  description: المالك — القوارب والصيانة والكباتن والطاقم
- name: owner-contacts
  description: المالك — العملاء والموردون والموظفون
- name: owner-trips
  description: المالك — الرحلات
- name: owner-sales
  description: المالك — البيع والإرسال للدلال
- name: notifications
  description: إشعارات الحساب — لكل الأدوار
- name: captain
  description: بوابة الكابتن — الرئيسة والرحلات وسجل الصيد
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: تسجيل الدخول بالجوال
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - password
              properties:
                phone:
                  type: string
                  example: '0500000001'
                password:
                  type: string
                  format: password
                device_name:
                  type: string
                  example: Samsung A54
                  description: يُحفظ مع الرمز لتمييز الأجهزة
                fcm_token:
                  type: string
                  description: رمز Firebase للإشعارات — يُحفظ مع الدخول
      responses:
        '200':
          description: دخول ناجح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 12|Yk3…
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        $ref: '#/components/schemas/User'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: تسجيل الخروج من الجهاز الحالي
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags:
      - auth
      summary: الحساب الحالي
      responses:
        '200':
          description: الحساب
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags:
      - auth
      summary: تعديل بيانات الحساب
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                locale:
                  type: string
                  enum:
                  - ar
                  - en
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/change-password:
    post:
      tags:
      - auth
      summary: تغيير كلمة المرور (يُخرج بقية الأجهزة)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/avatar:
    post:
      tags:
      - auth
      summary: رفع الصورة الشخصية (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPG/PNG/WebP حتى 2MB
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - auth
      summary: إزالة الصورة الشخصية
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/fcm-token:
    post:
      tags:
      - auth
      summary: تحديث رمز إشعارات Firebase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fcm_token
              properties:
                fcm_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Message'
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: طلب رمز التحقق لاستعادة كلمة المرور
      description: الردّ واحد وُجد الجوال أم لا. الرمز 6 أرقام صالح 10 دقائق و5 محاولات.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: '0500000001'
      responses:
        '200':
          description: أُرسل الرمز إن كان الجوال مسجّلًا
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 600
                        description: بالثواني
        '429':
          description: تجاوز الحدّ — انتظر دقيقة
  /auth/verify-otp:
    post:
      tags:
      - auth
      summary: التحقق من الرمز قبل شاشة كلمة المرور الجديدة
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: الرمز صحيح
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        example: true
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: كلمة المرور الجديدة بالرمز (يُخرج كل الأجهزة)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              - password
              - password_confirmation
              properties:
                phone:
                  type: string
                code:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /lookups:
    get:
      tags:
      - lookups
      summary: كل القوائم المرجعية في ردّ واحد
      responses:
        '200':
          description: القوائم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lookups'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags:
      - notifications
      summary: إشعارات الحساب (الأحدث أولًا) — meta.unread_count يحمل عدد غير المقروء
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
      - name: unread
        in: query
        description: 1 = غير المقروء فقط
        schema:
          type: boolean
      responses:
        '200':
          description: الإشعارات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    meta:
                      type: object
                      properties:
                        unread_count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/unread-count:
    get:
      tags:
      - notifications
      summary: عدد غير المقروء — لشارة الجرس
      responses:
        '200':
          description: العدد
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/read-all:
    post:
      tags:
      - notifications
      summary: تعليم كل الإشعارات مقروءة
      responses:
        '200':
          description: عدد ما عُلّم
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      marked:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/{notification}/read:
    parameters:
    - name: notification
      in: path
      required: true
      description: معرّف الإشعار
      schema:
        type: integer
    post:
      tags:
      - notifications
      summary: تعليم إشعار مقروءًا
      responses:
        '200':
          description: الإشعار بعد التعليم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /captain/dashboard:
    get:
      tags:
      - captain
      summary: رئيسة الكابتن — الأعداد، الرحلات التي بانتظاره، النشطة، وآخر رحلاته
      responses:
        '200':
          description: الرئيسة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CaptainDashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /captain/trips:
    get:
      tags:
      - captain
      summary: رحلات الكابتن — view=pending (بانتظارك) / active (في البحر) / completed / cancelled
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
      - name: view
        in: query
        schema:
          type: string
          enum:
          - pending
          - active
          - completed
          - cancelled
      - name: status
        in: query
        description: حالة الوزارة
        schema:
          type: string
      - name: search
        in: query
        description: رقم الرحلة
        schema:
          type: string
      responses:
        '200':
          description: الرحلات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Trip'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /captain/trips/{trip}:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف رحلة مسندة إلى الكابتن
      schema:
        type: integer
    get:
      tags:
      - captain
      summary: تفاصيل رحلة مع سطور المصيد
      responses:
        '200':
          description: رحلة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /captain/trips/{trip}/start:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    post:
      tags:
      - captain
      summary: ابدأ الرحلة → في البحر (يُبلَّغ المالك)
      responses:
        '200':
          description: الرحلة بعد الفعل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /captain/trips/{trip}/cancel:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    post:
      tags:
      - captain
      summary: إلغاء الرحلة بسبب إلزامي (قبل إرسال المخرجات)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
              - reason
      responses:
        '200':
          description: الرحلة بعد الفعل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /captain/trips/{trip}/catch:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    post:
      tags:
      - captain
      summary: تأكيد المخرجات وإنهاء الرحلة → بانتظار الإحصاء
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchInput'
      responses:
        '200':
          description: الرحلة بعد الفعل مع سطور المصيد
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /captain/catch-log:
    get:
      tags:
      - captain
      summary: سجل الصيد — سطور المصيد على رحلات الكابتن (الأحدث أولًا)
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
      - name: search
        in: query
        description: رقم الرحلة أو اسم الصنف
        schema:
          type: string
      responses:
        '200':
          description: السطور
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/CatchLogEntry'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /captain/catch-log/summary:
    get:
      tags:
      - captain
      summary: ملخص سجل الصيد بالصنف
      responses:
        '200':
          description: الملخص
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CatchLogSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/dashboard:
    get:
      tags:
      - owner
      summary: رئيسة المالك — المؤشرات والمخزون والرحلات النشطة وآخر المبيعات
      responses:
        '200':
          description: الرئيسة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/stock:
    get:
      tags:
      - owner
      summary: الأسماك المتوفرة عند المالك مجموعةً بالصنف
      responses:
        '200':
          description: المخزون
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockLine'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/stock/movements:
    get:
      tags:
      - owner
      summary: حركات الصنف (دفتر المخزون)
      parameters:
      - name: page
        in: query
        description: رقم الصفحة
        schema:
          type: integer
      - name: per_page
        in: query
        description: حجم الصفحة (حتى 100)
        schema:
          type: integer
          default: 25
      - name: species_id
        in: query
        description: صنف بعينه
        schema:
          type: integer
      - name: trip_id
        in: query
        description: رحلة بعينها
        schema:
          type: integer
      responses:
        '200':
          description: الحركات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StockMovement'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/dalals:
    get:
      tags:
      - owner
      summary: الدلالون المفعّلون — لقائمة الإرسال
      parameters:
      - name: search
        in: query
        description: بالاسم
        schema:
          type: string
      responses:
        '200':
          description: الدلالون
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        phone:
                          type: string
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/boats:
    get:
      tags:
      - owner-fleet
      summary: قائمة القوارب
      parameters:
      - name: page
        in: query
        description: رقم الصفحة
        schema:
          type: integer
      - name: per_page
        in: query
        description: حجم الصفحة (حتى 100)
        schema:
          type: integer
          default: 25
      - name: status
        in: query
        description: الحالة
        schema:
          type: string
      - name: search
        in: query
        description: الاسم أو الرقم
        schema:
          type: string
      responses:
        '200':
          description: القوارب
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Boat'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - owner-fleet
      summary: إضافة قارب
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoatInput'
      responses:
        '201':
          description: أُنشئ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Boat'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /owner/boats/{boat}:
    parameters:
    - name: boat
      in: path
      required: true
